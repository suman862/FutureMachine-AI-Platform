services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    ports:
      - "8000:8000"
    environment:
      TEXT_SERVICE_URL: http://text-service:8001
      VISION_SERVICE_URL: http://vision-service:8002
      AUDIO_SERVICE_URL: http://audio-service:8003
      HTTP_TIMEOUT_SECONDS: "120"
    depends_on:
      - text-service
      - vision-service
      - audio-service

  text-service:
    build:
      context: .
      dockerfile: services/text/Dockerfile
    environment:
      MODEL_ID: Qwen/Qwen2.5-1.5B-Instruct
    volumes:
      - hf-cache:/models/cache

  vision-service:
    build:
      context: .
      dockerfile: services/vision/Dockerfile
    environment:
      MODEL_ID: HuggingFaceTB/SmolVLM-500M-Instruct
    volumes:
      - hf-cache:/models/cache

  audio-service:
    build:
      context: .
      dockerfile: services/audio/Dockerfile
    environment:
      MODEL_ID: tiny
      DEVICE: cpu
      COMPUTE_TYPE: int8
    volumes:
      - hf-cache:/models/cache

  vllm:
    image: vllm/vllm-openai:latest
    command:
      - Qwen/Qwen2.5-1.5B-Instruct
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    ports:
      - "8010:8000"
    gpus: all
    ipc: host
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
      - vllm-cache:/root/.cache/vllm
    restart: unless-stopped

volumes:
  hf-cache:
  vllm-cache:
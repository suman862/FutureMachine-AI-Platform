name: CI-CD

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write
  security-events: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/toy-multimodal

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff format
        run: ruff format --check .

      - name: Ruff lint
        run: ruff check .

      - name: Mypy
        run: mypy gateway

      - name: Bandit
        run: bandit -r gateway services -ll

      - name: Tests
        run: pytest -q

  docker:
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: gateway
            file: Dockerfile.gateway
          - name: text
            file: services/text/Dockerfile
          - name: vision
            file: services/vision/Dockerfile
          - name: audio
            file: services/audio/Dockerfile

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: |
            toy-multimodal-${{ matrix.name }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.name }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.name }}:main
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: toy-multimodal-${{ matrix.name }}:${{ github.sha }}
          scan-type: image
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: docker
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Configure kubeconfig
        shell: bash
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBE_CONFIG_B64 }}" | base64 --decode > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Replace image placeholders
        run: |
          OWNER="${{ github.repository_owner }}"
          TAG="${{ github.sha }}"
          sed -i "s#ghcr.io/OWNER/toy-multimodal-gateway:IMAGE_TAG#ghcr.io/${OWNER}/toy-multimodal-gateway:${TAG}#g" deploy/k8s/gateway.yaml
          sed -i "s#ghcr.io/OWNER/toy-multimodal-text:IMAGE_TAG#ghcr.io/${OWNER}/toy-multimodal-text:${TAG}#g" deploy/k8s/text.yaml
          sed -i "s#ghcr.io/OWNER/toy-multimodal-vision:IMAGE_TAG#ghcr.io/${OWNER}/toy-multimodal-vision:${TAG}#g" deploy/k8s/vision.yaml
          sed -i "s#ghcr.io/OWNER/toy-multimodal-audio:IMAGE_TAG#ghcr.io/${OWNER}/toy-multimodal-audio:${TAG}#g" deploy/k8s/audio.yaml

      - name: Apply manifests
        run: kubectl apply -k deploy/k8s

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/gateway -n multimodal --timeout=10m
          kubectl rollout status deployment/text-service -n multimodal --timeout=15m
          kubectl rollout status deployment/vision-service -n multimodal --timeout=15m
          kubectl rollout status deployment/audio-service -n multimodal --timeout=15m

      - name: Smoke test
        run: |
          kubectl run ci-smoke \
            -n multimodal \
            --rm -i --restart=Never \
            --image=curlimages/curl:8.15.0 \
            -- curl --fail http://gateway:8000/health/live
